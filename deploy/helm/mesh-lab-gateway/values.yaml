replicaCount: 1

image:
  repository: ghcr.io/himanshugvu/mesh-lab-gateway
  tag: "0.0.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# In-cluster URLs of the backing services. These match the defaults used by
# the README installs (release name "mesh-lab" in namespace "mesh-lab").
config:
  meshLabUrl: http://mesh-lab-mesh-lab.mesh-lab.svc.cluster.local:80
  meshLabInventoryUrl: http://mesh-lab-mesh-lab-inventory.mesh-lab.svc.cluster.local:80

app:
  name: mesh-lab-gateway
  version: "v1"

serviceAccount:
  create: true
  name: ""

# Additional container env vars.
extraEnv: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10

monitoring:
  # kube-prometheus-stack API used by rollout AnalysisTemplates.
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  serviceMonitor:
    enabled: false
    interval: 15s
    additionalLabels: {}

rollout:
  # Requires the Argo Rollouts controller and CRDs to be installed first.
  enabled: false
  # canary | blueGreen - the edge gateway defaults to blue-green for an
  # instant switchback if post-promotion analysis detects regressions.
  strategy: blueGreen
  analysis:
    intervalSeconds: 20
    measurements: 5
    failureLimit: 0
    successRateThreshold: "0.90"
    lookbackSeconds: 120
  canary:
    maxSurge: 1
    steps:
      - setWeight: 25
      - pause:
          duration: 30s
      - analysis: {}
      - setWeight: 60
      - pause:
          duration: 30s
      - analysis: {}
  blueGreen:
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30
