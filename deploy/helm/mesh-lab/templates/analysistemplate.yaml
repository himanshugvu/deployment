{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "mesh-lab.fullname" . }}-success-rate
  labels:
    {{- include "mesh-lab.labels" . | nindent 4 }}
spec:
  args:
    - name: rollouts-pod-template-hash
  metrics:
    - name: success-rate
      interval: {{ .Values.rollout.analysis.intervalSeconds }}s
      count: {{ .Values.rollout.analysis.measurements }}
      successCondition: result[0] >= {{ .Values.rollout.analysis.successRateThreshold }}
      failureCondition: result[0] < {{ .Values.rollout.analysis.successRateThreshold }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      provider:
        prometheus:
          address: {{ .Values.monitoring.prometheusAddress }}
          query: |
            (
              1 - (
                sum(increase(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}", status=~"5..", rollouts_pod_template_hash="{{ "{{args.rollouts-pod-template-hash}}" }}"}[{{ .Values.rollout.analysis.lookbackSeconds }}s]))
                /
                clamp_min(sum(increase(http_server_requests_seconds_count{namespace="{{ .Release.Namespace }}", rollouts_pod_template_hash="{{ "{{args.rollouts-pod-template-hash}}" }}"}[{{ .Values.rollout.analysis.lookbackSeconds }}s])), 1)
              )
            ) or vector(1)
{{- end }}
