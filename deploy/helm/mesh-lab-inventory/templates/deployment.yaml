{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "mesh-lab-inventory.fullname" . }}
  labels:
    {{- include "mesh-lab-inventory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mesh-lab-inventory.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if .Values.rollout.enabled }}
  strategy:
    {{- if eq .Values.rollout.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ include "mesh-lab-inventory.fullname" . }}
      previewService: {{ include "mesh-lab-inventory.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
      postPromotionAnalysis:
        templates:
          - templateName: {{ include "mesh-lab-inventory.fullname" . }}-success-rate
        args:
          - name: rollouts-pod-template-hash
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['rollouts-pod-template-hash']
    {{- else }}
    canary:
      maxSurge: {{ .Values.rollout.canary.maxSurge }}
      steps:
        {{- range .Values.rollout.canary.steps }}
        {{- if hasKey . "setWeight" }}
        - setWeight: {{ .setWeight }}
        {{- else if hasKey . "pause" }}
        - pause:
            duration: {{ .pause.duration }}
        {{- else if hasKey . "analysis" }}
        - analysis:
            templates:
              - templateName: {{ include "mesh-lab-inventory.fullname" $ }}-success-rate
            args:
              - name: rollouts-pod-template-hash
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['rollouts-pod-template-hash']
        {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mesh-lab-inventory.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Values.app.version | quote }}
    spec:
      serviceAccountName: {{ include "mesh-lab-inventory.serviceAccountName" . }}
      containers:
        - name: mesh-lab-inventory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_NAME
              value: {{ .Values.app.name | quote }}
            - name: APP_VERSION
              value: {{ .Values.app.version | quote }}
            - name: CHAOS_ERROR_RATE
              value: {{ .Values.chaos.errorRate | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
