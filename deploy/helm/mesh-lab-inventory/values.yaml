replicaCount: 1

image:
  repository: ghcr.io/himanshugvu/mesh-lab-inventory
  tag: "0.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

app:
  name: mesh-lab-inventory
  version: "v1"

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    additionalLabels: {}

rollout:
  # Requires the Argo Rollouts controller and CRDs to be installed first.
  enabled: false
  canary:
    steps:
      - setWeight: 25
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
