replicaCount: 1

image:
  repository: ghcr.io/himanshugvu/mesh-lab-inventory
  tag: "0.0.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

app:
  name: mesh-lab-inventory
  version: "v1"

serviceAccount:
  create: true
  name: ""

# Additional container env vars, e.g. CHAOS_ERROR_RATE for failure drills.
extraEnv: []

# Failure injection for rollout rollback drills (0-100 percent of requests
# answered with HTTP 500). Keep 0 outside of tests.
chaos:
  errorRate: "0"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10

monitoring:
  # kube-prometheus-stack API used by rollout AnalysisTemplates.
  prometheusAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
  serviceMonitor:
    enabled: false
    interval: 15s
    additionalLabels: {}

rollout:
  # Requires the Argo Rollouts controller and CRDs to be installed first.
  enabled: false
  # canary | blueGreen
  strategy: canary
  analysis:
    # Prometheus-driven success-rate gate rendered as an AnalysisTemplate.
    intervalSeconds: 20
    measurements: 5
    failureLimit: 0
    successRateThreshold: "0.90"
    lookbackSeconds: 120
  canary:
    maxSurge: 1
    steps:
      - setWeight: 25
      - pause:
          duration: 30s
      - analysis: {}
      - setWeight: 60
      - pause:
          duration: 30s
      - analysis: {}
    # Exact weighted splitting via Istio VirtualService (requires sidecars).
    # Renders a -canary Service and a VirtualService; the Rollout controller
    # manages their selectors/weights during steps.
    trafficRouting:
      enabled: false
  blueGreen:
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30

podDisruptionBudget:
  # Meaningful only when replicaCount > 1: minAvailable=1 on a single replica
  # would block all node drains.
  enabled: false
  minAvailable: 1