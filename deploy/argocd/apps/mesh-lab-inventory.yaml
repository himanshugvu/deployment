apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-lab-inventory
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/himanshugvu/deployment.git
    targetRevision: main
    path: deploy/helm/mesh-lab-inventory
    helm:
      releaseName: mesh-lab
      parameters:
        - name: rollout.enabled
          value: "true"
        - name: rollout.strategy
          value: canary
        - name: rollout.canary.trafficRouting.enabled
          value: "true"
        - name: monitoring.serviceMonitor.enabled
          value: "true"
        - name: monitoring.serviceMonitor.additionalLabels.release
          value: monitoring
  ignoreDifferences:
    # The Rollouts controller rewrites these during canary steps; without
    # this, selfHeal would fight the traffic splitter forever.
    - group: networking.istio.io
      kind: VirtualService
      jqPathExpressions:
        - .spec.http[].route[].weight
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
  destination:
    server: https://kubernetes.default.svc
    namespace: mesh-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
