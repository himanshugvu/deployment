apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-lab-inventory
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/himanshugvu/deployment.git
    targetRevision: main
    path: deploy/helm/mesh-lab-inventory
    helm:
      releaseName: mesh-lab
      parameters:
        - name: rollout.enabled
          value: "true"
        - name: rollout.strategy
          value: canary
        # Rollback drill: inject HTTP 500s on the canary ReplicaSet.
        - name: chaos.errorRate
          value: "50"
        # Force a fresh ReplicaSet so the drill exercises a new canary.
        - name: app.version
          value: v2
        - name: monitoring.serviceMonitor.enabled
          value: "true"
        - name: monitoring.serviceMonitor.additionalLabels.release
          value: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: mesh-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
