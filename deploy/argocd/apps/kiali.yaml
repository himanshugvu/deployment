apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 1.26.2
    helm:
      values: |
        auth:
          strategy: anonymous
        istio_namespace: istio-system
        external_services:
          prometheus:
            url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          grafana:
            enabled: true
            in_cluster_url: http://monitoring-grafana.monitoring.svc:80
            url: http://localhost:3000
          tracing:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kiali
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
