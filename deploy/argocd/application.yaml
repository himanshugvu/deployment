apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mesh-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/himanshugvu/deployment.git
    targetRevision: main
    path: deploy/helm/mesh-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: mesh-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
