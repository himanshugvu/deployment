spring:
  application:
    name: mesh-lab-gateway
  lifecycle:
    # Drain in-flight requests on SIGTERM before stopping.
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          routes:
            - id: mesh-lab
              uri: ${MESH_LAB_URL:http://localhost:8081}
              predicates:
                - Path=/api/status,/api/echo
            - id: mesh-lab-inventory
              uri: ${MESH_LAB_INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: ${app.name}
    version: ${app.version}

app:
  name: mesh-lab-gateway
  version: local
