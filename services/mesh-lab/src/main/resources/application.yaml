spring:
  application:
    name: mesh-lab
  lifecycle:
    # Drain in-flight requests on SIGTERM before stopping.
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${app.name}
    version: ${app.version}

app:
  name: mesh-lab
  version: local

chaos:
  error-rate: ${CHAOS_ERROR_RATE:0}
