name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mesh-lab, mesh-lab-inventory, mesh-lab-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -q test

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint charts
        run: |
          for chart in deploy/helm/*/; do
            helm lint "$chart"
          done

  build-push:
    # Images are published only from main; PRs stop at tests + lint.
    if: github.event_name == 'push'
    needs: [test, helm-lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mesh-lab
          - service: mesh-lab-inventory
          - service: mesh-lab-gateway
    steps:
      - uses: actions/checkout@v4
      - name: Read chart appVersion as the image tag
        id: meta
        working-directory: deploy/helm/${{ matrix.service }}
        run: echo "tag=$(awk '/^appVersion:/ {gsub(/"/,"",$2); print $2}' Chart.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:sha-${{ github.sha }}

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Server-side dry-run is not possible without a cluster; YAML sanity via python
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml, glob, sys
          files = [f for f in glob.glob('deploy/**/*.yaml', recursive=True) if 'templates' not in f]
          bad = 0
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
              except Exception as e:
                  bad += 1
                  print(f'FAIL {f}: {e}')
          print(f'{len(files)} files checked')
          sys.exit(1 if bad else 0)
          EOF
